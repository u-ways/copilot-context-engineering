[project]
name = "copilot-context-engineering"
version = "0.1.0"
description = "Hands-on playground: repository instructions vs Agent Skills vs custom agents for GitHub Copilot CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "U-ways E." }]
keywords = ["copilot", "context-engineering", "agent-skills", "custom-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "structlog>=26.1",
    "typer>=0.27",
]

[project.urls]
Homepage = "https://github.com/u-ways/copilot-context-engineering"
Releases = "https://github.com/u-ways/copilot-context-engineering/releases"

[project.scripts]
cce = "cce.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cce"]

[tool.uv]
required-version = ">=0.12"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "ARG", "PTH", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-markers -ra -m 'not e2e and not llm'"
testpaths = ["tests"]
markers = [
    "e2e: needs network access to clone the pinned upstream repository",
    "llm: runs a real coding agent (copilot or claude) against rendered scenarios",
]

[tool.coverage.run]
branch = true
source = ["cce"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

name: Release Drafter

# On every push to main: read the version from pyproject.toml, stop if its tag already
# exists (Dependabot merges and docs-only merges never bump it), check the two version
# files agree, then recreate the draft release for that tag with GitHub's generated
# notes, categorised by pull-request label through .github/release.yml. The "Release
# Detailer" workflow then enriches the draft; a human publishes it.

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    draft:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check out
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Read version
              id: version
              run: |
                  version="$(grep -m 1 -E '^version = "' pyproject.toml | sed -E 's/^version = "([^"]+)".*$/\1/')"
                  if test -z "$version"; then
                      echo '::error::Could not find a version = "X" line in pyproject.toml'
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
            - name: Skip if tag exists
              id: tag
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
                      echo "::notice::Tag v$VERSION already exists; nothing to draft"
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi
            - name: Check version parity
              if: steps.tag.outputs.exists != 'true'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  init_version="$(grep -m 1 -E '^__version__ = "' src/cce/__init__.py | sed -E 's/^__version__ = "([^"]+)".*$/\1/')"
                  if test "$init_version" != "$VERSION"; then
                      echo "::error::Version mismatch: pyproject.toml has $VERSION but src/cce/__init__.py has ${init_version:-no __version__}"
                      exit 1
                  fi
            - name: Recreate the draft release
              if: steps.tag.outputs.exists != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  # Only drafts are ever deleted; published releases are never drafts.
                  gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.draft) | .id' \
                      | while read -r id; do
                          test -n "$id" && gh api -X DELETE "repos/$GH_REPO/releases/$id"
                      done
                  link="$(gh release create "v$VERSION" --draft --generate-notes --title "v$VERSION" --target "$GITHUB_SHA")"
                  echo "::notice title=Draft v$VERSION::$link"

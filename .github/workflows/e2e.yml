name: E2E

on:
    workflow_dispatch:
    schedule:
        - cron: "0 7 * * 1"

permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v7
            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
            - name: Set up just
              uses: extractions/setup-just@v4
            - name: Install
              run: just install
            - name: End-to-end tests
              run: just e2e

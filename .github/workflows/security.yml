name: Security

on:
    pull_request:
    schedule:
        - cron: "0 6 * * 1"

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v7
            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
            - name: Set up just
              uses: extractions/setup-just@v4
            - name: Audit dependencies
              run: just audit

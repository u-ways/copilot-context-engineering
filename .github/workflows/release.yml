name: Release

# Publishes the release for a tag. Publishing a draft from the Releases page creates the
# tag, which runs this on push; workflow_dispatch with a version creates the tag first.
# The publish step is idempotent across the three starting states: a draft exists (it is
# published as is, notes untouched), a published release exists (nothing to do), nothing
# exists (a release is created with generated notes).

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version to publish, without the leading v"
                required: true
                type: string

permissions:
    contents: write

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check out
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Resolve version
              id: version
              env:
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  if test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
                      version="${INPUT_VERSION#v}"
                  else
                      version="${GITHUB_REF_NAME#v}"
                  fi
                  if test -z "$version"; then
                      echo "::error::Could not resolve a version to publish"
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
            - name: Create tag if missing
              if: github.event_name == 'workflow_dispatch'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if ! git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git tag "v$VERSION"
                      git push origin "v$VERSION"
                  fi
            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  state="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo "missing")"
                  case "$state" in
                      true)
                          gh release edit "v$VERSION" --draft=false --latest
                          echo "::notice::Published the draft for v$VERSION; its notes were kept as drafted"
                          ;;
                      false)
                          echo "::notice::v$VERSION is already published; nothing to do"
                          ;;
                      *)
                          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --latest
                          echo "::notice::Created and published v$VERSION with generated notes"
                          ;;
                  esac

name: LLM tests

on:
    workflow_dispatch:
    schedule:
        - cron: "0 8 * * 1"
    pull_request:
        types:
            - labeled
            - synchronize

permissions:
    contents: read

jobs:
    llm:
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'llm-tests')
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - name: Check out
              uses: actions/checkout@v7
            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
            - name: Set up just
              uses: extractions/setup-just@v4
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: Install Claude Code
              run: npm install -g @anthropic-ai/claude-code@2.1.270
            - name: Install
              run: just install
            - name: Run the LLM tier on Claude Code
              env:
                  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
              run: just llm claude
            - name: Upload structural results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: llm-results
                  path: .cce-artifacts/results/
                  if-no-files-found: ignore

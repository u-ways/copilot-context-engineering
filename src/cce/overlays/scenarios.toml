# Scenario manifest. Everything that differs between scenarios is declared here;
# Python never branches on a scenario id or slug.

[source]
url = "https://github.com/u-ways/software-engineering-quality-framework"
ref = "6241aad0e6377588b624e7b5d407a6a0c3236e26"
procedures = "_shared/procedures"

[[scenario]]
id = "01"
slug = "01-instructions-timeless"
title = "Instructions hold durable rules, not changing repo state"
overlay = "01-instructions-timeless"

# Two outcomes are valid: the model applies the stale allowlist (and damages
# practices/actions-best-practices.md), or it notices the later hardening and refuses.
# Either way it must engage with that page and touch nothing else.
[[scenario.checks]]
name = "stale-guidance"
prompt = "Bring practices/actions-best-practices.md into line with the approved GitHub Actions guidance in the repository instructions."
contains = ["(?i)(actions|guidance|approved|pinn|cooldown|drift|instructions)"]
files_changed_max = 1

[[scenario]]
id = "02"
slug = "02-instructions-context-cost"
title = "Task runbooks in instructions are paid on every request"
overlay = "02-instructions-context-cost"

[[scenario.checks]]
name = "lookup"
prompt = "In principles.md, how many engineering principles does the framework list, and what is the first one? Reply with the number, the name and the path:line where you found it."
contains = ["\\b7\\b", "(?i)eliminate waste", "principles\\.md"]
skills_loaded = []
files_changed_max = 0

[[scenario]]
id = "03"
slug = "03-skills-on-demand"
title = "The same procedures as skills cost nothing until matched"
overlay = "03-skills-on-demand"
skills = {}

[[scenario.checks]]
name = "lookup"
prompt = "In principles.md, how many engineering principles does the framework list, and what is the first one? Reply with the number, the name and the path:line where you found it."
contains = ["\\b7\\b", "(?i)eliminate waste", "principles\\.md"]
skills_loaded = []
files_changed_max = 0

[[scenario.checks]]
name = "decision-record"
prompt = "Draft an Any Decision Record (ADR) for choosing a managed database service instead of running the database ourselves. Output the ADR only; do not edit any files."
contains = ["(?i)\\bdecision\\b"]
skills_loaded = ["cloud-architecture-decision"]
files_changed_max = 0

[[scenario]]
id = "04"
slug = "04-skills-description-routing"
title = "Descriptions route skills"
overlay = "04-skills-description-routing"
skills = { rename = "seqf-procedure-{n}", rotate_descriptions = 1 }

# The routing proof is skills_loaded. Some models then follow the mis-routed
# body (and print its tracer line), others notice the mismatch; the prose varies.
[[scenario.checks]]
name = "decision-record"
prompt = "Draft an Any Decision Record (ADR) for choosing a managed database service instead of running the database ourselves. Output the ADR only; do not edit any files."
contains = ["(?i)\\bdecision\\b"]
skills_loaded = ["seqf-procedure-4"]
files_changed_max = 0

[[scenario]]
id = "05"
slug = "05-agent-permissions"
title = "Permissions belong to the role"
overlay = "05-agent-permissions"
skills = {}
agents = ["researcher", "author", "validator"]
executable = ["STRUGGLE.sh"]
files = [
    { src = "_shared/scripts/cce-check-links.py", dest = "scripts/cce-check-links.py", executable = true },
]

[[scenario.checks]]
name = "researcher"
agent = "researcher"
prompt = "This framework mandates 100% unit-test coverage before release. 1) Find the statement that sets this requirement and cite it as path:line; if the framework does not state it anywhere, say so in your first sentence and cite the strongest evidence against it. 2) Whatever you conclude, write your findings to NOTES-coverage.md at the repository root, one line per citation. Work only from files in this worktree."
contains = ["practices/testing\\.md"]
files_changed_max = 0

[[scenario.checks]]
name = "author"
agent = "author"
prompt = "This framework mandates 100% unit-test coverage before release. 1) Find the statement that sets this requirement and cite it as path:line; if the framework does not state it anywhere, say so in your first sentence and cite the strongest evidence against it. 2) Whatever you conclude, write your findings to NOTES-coverage.md at the repository root, one line per citation. Work only from files in this worktree."
files_changed = ["NOTES-coverage.md"]

[[scenario.checks]]
name = "validator"
agent = "validator"
prompt = "Run the repository's Markdown link validator (scripts/cce-check-links.py) and report its findings; fix nothing."
contains = ["SECURITY\\.md:23", "RESULT: FAIL"]
files_changed_max = 0

[[scenario]]
id = "06"
slug = "06-agent-context-isolation"
title = "Delegate when you need the result, not the investigation"
overlay = "06-agent-context-isolation"
agents = ["auditor"]
tabs = [{ label = "copilot:auditor", command = "copilot --agent auditor" }]

[[scenario.checks]]
name = "delegated"
prompt = "How many Markdown pages in this repository are missing a \"## Context\" section? Exclude the .github directory. Use the auditor agent and give me only the number and its scope."
contains = ["\\b25\\b"]
files_changed_max = 0

[[scenario.checks]]
name = "direct"
agent = "auditor"
prompt = "How many Markdown pages in this repository are missing a \"## Context\" section? Exclude the .github directory. Use the auditor agent and give me only the number and its scope."
contains = ["\\b25\\b"]
files_changed_max = 0

# Cross-run assertions for the LLM tier: left's metric must exceed ratio x right's.
# input_tokens = the main thread's final call context; main_input_tokens and
# subagent_input_tokens = cumulative input tokens over the run.
[[compare]]
metric = "input_tokens"
left = "02/lookup"
right = "03/lookup"
ratio = 1.5

[[compare]]
metric = "main_input_tokens"
left = "06/direct"
right = "06/delegated"
ratio = 1.5

[[compare]]
metric = "subagent_input_tokens"
left = "06/delegated"
right = "06/delegated"
right_metric = "main_input_tokens"
ratio = 3.0
